<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" font-family="Menlo">
  <defs>
    <style>
      .region { fill: #F6F8FA; }
      .card { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1; }
      .human-card { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1; }
      .icon { fill: none; stroke: #1F2328; stroke-width: 0.9; stroke-linecap: round; stroke-linejoin: round; }
      .title { fill: #1F2328; font-size: 8.2px; font-weight: 600; text-anchor: middle; }
      .region-title { fill: #1F2328; font-size: 8.8px; font-weight: 600; text-anchor: middle; }
      .text { fill: #59636E; font-size: 5.8px; text-anchor: middle; }
      .flow-label { fill: #B45309; font-size: 5.5px; font-weight: 600; text-anchor: middle; }
      .connector { fill: none; stroke: #B45309; stroke-width: 1; marker-end: url(#arrowhead); }
      .return { fill: none; stroke: #B45309; stroke-width: 1; stroke-dasharray: 3 3; marker-end: url(#arrowhead); }
      .return-branch { fill: none; stroke: #B45309; stroke-width: 1; stroke-dasharray: 3 3; }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#B45309"/>
    </marker>
    <pattern id="dot-grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.65" fill="#8C959F" opacity="0.2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="680" height="350" fill="#FFFFFF"/>
  <rect x="18" y="18" width="644" height="314" fill="url(#dot-grid)"/>

  <!-- Human exchange -->
  <rect x="235" y="22" width="210" height="42" rx="3" class="human-card"/>
  <circle cx="262" cy="36" r="3" class="icon"/>
  <path d="M255 50 Q262 42 269 50" class="icon"/>
  <text x="354" y="47" class="title">Human context and decisions</text>
  <line x1="294" y1="88" x2="294" y2="68" class="connector"/>
  <text x="252" y="80" class="flow-label">Pull in a human</text>
  <line x1="386" y1="68" x2="386" y2="88" class="connector"/>
  <text x="442" y="80" class="flow-label">Additional human input</text>

  <!-- Work Item -->
  <rect x="18" y="140" width="78" height="130" rx="3" class="card"/>
  <rect x="48" y="155" width="18" height="22" rx="1" class="icon"/>
  <line x1="52" y1="161" x2="62" y2="161" class="icon"/>
  <line x1="52" y1="166" x2="62" y2="166" class="icon"/>
  <line x1="52" y1="171" x2="59" y2="171" class="icon"/>
  <text x="57" y="198" class="title">Work Item</text>
  <text x="57" y="218" class="text">Planned work</text>
  <text x="57" y="228" class="text">that can be built</text>
  <text x="57" y="238" class="text">and reviewed</text>
  <text x="57" y="248" class="text">independently.</text>
  <!-- Attempt -->
  <rect x="112" y="88" width="456" height="244" rx="3" class="region"/>
  <text x="340" y="108" class="region-title">Attempt</text>
  <line x1="96" y1="188" x2="126" y2="188" class="connector"/>
  <text x="111" y="177" class="flow-label">run</text>

  <!-- Writer -->
  <rect x="126" y="132" width="94" height="112" rx="3" class="card"/>
  <path d="M165 154 L173 146 L178 151 L170 159 L164 160 Z" class="icon"/>
  <line x1="173" y1="146" x2="178" y2="151" class="icon"/>
  <text x="173" y="181" class="title">Writer</text>
  <text x="173" y="201" class="text">Implements the change,</text>
  <text x="173" y="211" class="text">writes or updates tests,</text>
  <text x="173" y="221" class="text">and commits a candidate.</text>

  <line x1="220" y1="188" x2="234" y2="188" class="connector"/>

  <!-- Reviewers -->
  <rect x="234" y="132" width="94" height="112" rx="3" class="card"/>
  <rect x="257" y="146" width="14" height="17" rx="1" class="icon"/>
  <rect x="274" y="146" width="14" height="17" rx="1" class="icon"/>
  <rect x="291" y="146" width="14" height="17" rx="1" class="icon"/>
  <path d="M260 154 L263 157 L268 151 M277 154 L280 157 L285 151 M294 154 L297 157 L302 151" class="icon"/>
  <text x="281" y="181" class="title">Reviewers</text>
  <text x="281" y="201" class="text">Inspect code and tests</text>
  <text x="281" y="211" class="text">in parallel using</text>
  <text x="281" y="221" class="text">focused evidence.</text>

  <line x1="328" y1="188" x2="342" y2="188" class="connector"/>

  <!-- Tester -->
  <rect x="342" y="132" width="104" height="112" rx="3" class="card"/>
  <rect x="385" y="146" width="18" height="15" rx="1" class="icon"/>
  <line x1="385" y1="151" x2="403" y2="151" class="icon"/>
  <path d="M389 155 L392 158 L398 153" class="icon"/>
  <text x="394" y="181" class="title">Tester</text>
  <text x="394" y="201" class="text">Runs the complete suite</text>
  <text x="394" y="211" class="text">once after reviews</text>
  <text x="394" y="221" class="text">and records results.</text>

  <line x1="446" y1="188" x2="460" y2="188" class="connector"/>

  <!-- Learner -->
  <rect x="460" y="132" width="94" height="112" rx="3" class="card"/>
  <path d="M489 149 Q498 145 507 150 V162 Q498 157 489 162 Z" class="icon"/>
  <path d="M507 150 Q516 145 525 149 V162 Q516 157 507 162 Z" class="icon"/>
  <path d="M497 143 Q507 136 517 143" class="icon"/>
  <path d="M513 140 L517 143 L513 146" class="icon"/>
  <text x="507" y="181" class="title">Learner</text>
  <text x="507" y="201" class="text">Updates Expertise</text>
  <text x="507" y="211" class="text">and records possible</text>
  <text x="507" y="221" class="text">follow-ups.</text>

  <!-- Correction loop -->
  <path d="M281 244 V264" class="return-branch"/>
  <path d="M394 244 V264" class="return-branch"/>
  <path d="M394 264 H173 V248" class="return"/>
  <text x="284" y="281" class="flow-label">Tester regressions and blocking review findings return to the Writer</text>

  <text x="340" y="318" class="text">Runs in local sandboxes or on remote machines.</text>

  <!-- Merge Candidate -->
  <line x1="554" y1="188" x2="584" y2="188" class="connector"/>
  <text x="569" y="177" class="flow-label">ready</text>
  <rect x="584" y="140" width="78" height="130" rx="3" class="card"/>
  <circle cx="615" cy="159" r="3" class="icon"/>
  <circle cx="631" cy="159" r="3" class="icon"/>
  <circle cx="623" cy="173" r="3" class="icon"/>
  <path d="M618 159 H628 M615 162 V170 H620 M631 162 V170 H626" class="icon"/>
  <text x="623" y="196" class="title">Merge</text>
  <text x="623" y="207" class="title">Candidate</text>
  <text x="623" y="231" class="text">Reviewed change</text>
  <text x="623" y="241" class="text">ready to land.</text>
</svg>

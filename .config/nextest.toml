# These process and relay cases have short deadlines that measure their own
# work. Give each case the full test pool so unrelated fixture processes do
# not consume that deadline.
[[profile.default.overrides]]
filter = '''
  test(=attempt_cancel_between_tester_command_and_extractor_blocks_next_child) +
  test(=attempt_cancel_between_tester_commands_blocks_next_child) +
  test(=integrated_upgrade_driver_settles_foreground_attempt) +
  test(=launch_handoff_route_task_recovers_after_parent_publication_loss) +
  test(=tester_settled_command_barrier_allows_normal_completion) +
  test(=verification_worker_does_not_block_unrelated_attempt_progress) +
  test(=codex_relay_delivers_overlapping_app_responses_and_turn_events) +
  test(=workflow_integrated_child_receipt_survives_parent_crash)
'''
threads-required = "num-test-threads"
